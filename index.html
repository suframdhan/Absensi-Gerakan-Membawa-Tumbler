<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SATRIA - Sistem Administrasi Terintegrasi Rangkaian Informasi Aktifitas Praktik Kerja Lapangan (PKL) MAN 1 Kota Cirebon">
    <title>Gerakan Siswa Membawa Tumbler MAN 1 Kota Cirebon</title>
    
    <!-- Google Fonts & FontAwesome untuk Ikon -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Konfigurasi PWA -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="https://i.ibb.co.com/990f8Z1S/Untitled-500-x-500-px-e1736830153862.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #F4F4F4; /* Disamakan dengan warna dasar loading screen */
            font-family: 'Montserrat', sans-serif; 
        }
        
        /* Layar pemuatan Full Video */
        #loading-screen {
            position: fixed;
            inset: 0;
            /* Mengubah warna background agar menyatu dengan video */
            background-color: #F4F4F4; 
            z-index: 999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #loading-screen video {
            width: 80%;
            max-width: 500px;
            height: auto;
            object-fit: contain;
        }
        
        /* Bingkai aplikasi utama yang memenuhi layar */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Animasi Loading Full Video -->
    <div id="loading-screen">
        <video autoplay loop muted playsinline>
            <source src="https://raw.githubusercontent.com/suframdhan/Absensi-Gerakan-Membawa-Tumbler/refs/heads/main/MAN%201.mp4" type="video/mp4">
        </video>
    </div>

    <!-- Iframe dengan URL Web App Google Apps Script Anda -->
    <iframe id="app-frame" src="https://script.google.com/macros/s/AKfycbydxiPUgeyqWJYYOwVlCnkU_zDGDS_A5h_TnW5hYanF1ROqJyUzynXvL0fBpdY3dQXO/exec" 
            onload="const screen = document.getElementById('loading-screen'); screen.style.opacity='0'; setTimeout(()=>screen.style.visibility='hidden', 500);"
            allow="fullscreen; camera; microphone; clipboard-read; clipboard-write">
    </iframe>
</body>
</html>
